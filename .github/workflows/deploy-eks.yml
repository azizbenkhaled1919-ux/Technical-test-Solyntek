name: Deploy To AWS EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # Requis pour pousser vers ghcr.io

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: solyntek
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/solyntek-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/solyntek-frontend

jobs:
  terraform:
    name: Terraform — Validate Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

  build-and-push:
    name: Build & Push Docker Images to GHCR
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # Token automatique, aucun secret à configurer

      - name: Build and push backend image
        run: |
          docker build \
            -t ${{ env.IMAGE_BACKEND }}:${{ github.sha }} \
            -t ${{ env.IMAGE_BACKEND }}:latest \
            ./backend
          docker push ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          docker push ${{ env.IMAGE_BACKEND }}:latest

      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg REACT_APP_SERVER_URL=http://LOAD_BALANCER_URL/api \
            -t ${{ env.IMAGE_FRONTEND }}:${{ github.sha }} \
            -t ${{ env.IMAGE_FRONTEND }}:latest \
            ./frontend
          docker push ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          docker push ${{ env.IMAGE_FRONTEND }}:latest

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      - name: Create GHCR image pull secret
        run: |
          # Permet à EKS de puller les images depuis ghcr.io
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --namespace=default \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update manifests
        run: |
          sed -i "s|image: backend:latest|image: ${{ env.IMAGE_BACKEND }}:${{ github.sha }}|g" k8s/backend/deployment.yaml
          sed -i "s|image: frontend:latest|image: ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}|g" k8s/frontend/deployment.yaml
          sed -i "s|change_me_jwt_secret|${{ secrets.JWT_SECRET }}|g" k8s/backend/secret.yaml

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/mongodb/
          kubectl apply -f k8s/backend/
          kubectl apply -f k8s/frontend/
