name: Deploy To AWS EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: true
  CLUSTER_NAME: solyntek

jobs:

  # ──────────────────────────────────────────
  # Job 1 : Terraform → crée/met à jour les repositories ECR
  # ──────────────────────────────────────────
  terraform:
    name: Provision ECR with Terraform
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
    outputs:
      ecr_backend_url:  ${{ steps.tf_output.outputs.ecr_backend_url }}
      ecr_frontend_url: ${{ steps.tf_output.outputs.ecr_frontend_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set aws_session_token ${{ secrets.AWS_SESSION_TOKEN }}
          aws configure set default.region ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve -input=false \
            -var "aws_region=${AWS_REGION}"

      - name: Capture Terraform outputs
        id: tf_output
        working-directory: terraform
        run: |
          echo "ecr_backend_url=$(terraform output -raw ecr_backend_url)"   >> "${GITHUB_OUTPUT}"
          echo "ecr_frontend_url=$(terraform output -raw ecr_frontend_url)" >> "${GITHUB_OUTPUT}"

  # ──────────────────────────────────────────
  # Job 2 : Build et push des images Docker sur ECR
  # ──────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set aws_session_token ${{ secrets.AWS_SESSION_TOKEN }}
          aws configure set default.region ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
          docker login --username AWS --password-stdin \
            ${{ needs.terraform.outputs.ecr_backend_url }}

      - name: Build and push backend image
        run: |
          docker build \
            -t ${{ needs.terraform.outputs.ecr_backend_url }}:${{ github.sha }} \
            -t ${{ needs.terraform.outputs.ecr_backend_url }}:latest \
            ./backend
          docker push ${{ needs.terraform.outputs.ecr_backend_url }}:${{ github.sha }}
          docker push ${{ needs.terraform.outputs.ecr_backend_url }}:latest

      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg REACT_APP_SERVER_URL=http://LOAD_BALANCER_URL/api \
            -t ${{ needs.terraform.outputs.ecr_frontend_url }}:${{ github.sha }} \
            -t ${{ needs.terraform.outputs.ecr_frontend_url }}:latest \
            ./frontend
          docker push ${{ needs.terraform.outputs.ecr_frontend_url }}:${{ github.sha }}
          docker push ${{ needs.terraform.outputs.ecr_frontend_url }}:latest

  # ──────────────────────────────────────────
  # Job 3 : Déploiement sur EKS via kubectl
  # ──────────────────────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: [terraform, build-and-push]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set aws_session_token ${{ secrets.AWS_SESSION_TOKEN }}
          aws configure set default.region ${{ env.AWS_REGION }}

      - name: Configure kubectl pour EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.CLUSTER_NAME }}

      - name: Mettre à jour les images dans les manifests k8s
        run: |
          sed -i "s|image: backend:latest|image: ${{ needs.terraform.outputs.ecr_backend_url }}:${{ github.sha }}|g" \
            k8s/backend/deployment.yaml
          sed -i "s|image: frontend:latest|image: ${{ needs.terraform.outputs.ecr_frontend_url }}:${{ github.sha }}|g" \
            k8s/frontend/deployment.yaml
          sed -i "s|imagePullPolicy: Never|imagePullPolicy: Always|g" \
            k8s/backend/deployment.yaml k8s/frontend/deployment.yaml

      - name: Injecter JWT_SECRET dans le Secret Kubernetes
        run: |
          sed -i "s|change_me_jwt_secret|${{ secrets.JWT_SECRET }}|g" \
            k8s/backend/secret.yaml

      - name: Appliquer les manifests Kubernetes
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/mongodb/
          kubectl apply -f k8s/backend/
          kubectl apply -f k8s/frontend/

      - name: Attendre que les déploiements soient prêts
        run: |
          kubectl rollout status deployment/mongodb  -n solyntek --timeout=120s
          kubectl rollout status deployment/backend  -n solyntek --timeout=120s
          kubectl rollout status deployment/frontend -n solyntek --timeout=120s

      - name: Afficher l'URL publique du frontend
        run: |
          echo "En attente de l'adresse du LoadBalancer..."
          sleep 30
          kubectl get svc frontend -n solyntek
